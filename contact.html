  <section class="page-hero" style="background-image: url('images/works/single-bed/2-hero.webp');">
    <div class="page-hero-content">
      <h1>聯絡我</h1>
      <p>客製需求、合作邀約，或單純聊聊木工</p>
    </div>
  </section>

  <main>
    <div class="intro">
      <p>不管是想訂製一件屬於自己的木作、對某件作品有興趣，還是純粹想交流木工心得，
        都歡迎填寫下方表單，我會盡快回覆你！</p>

      <form class="contact-form" action="https://formspree.io/f/meeyyqel" method="POST">
        <div class="form-row">
          <div class="form-field">
            <label for="f-name">姓名</label>
            <input type="text" id="f-name" name="name" placeholder="怎麼稱呼你？" required>
          </div>
          <div class="form-field">
            <label for="f-phone">電話</label>
            <input type="tel" id="f-phone" name="phone" placeholder="方便聯絡的電話">
          </div>
        </div>
        <div class="form-field">
          <label for="f-email">Email</label>
          <input type="email" id="f-email" name="email" placeholder="你的 Email，方便我回覆你" required>
        </div>
        <div class="form-field">
          <label for="f-msg">想聊聊的內容</label>
          <textarea id="f-msg" name="message" rows="5" placeholder="客製尺寸、想做的作品，或單純打聲招呼" required></textarea>
        </div>
        <button type="submit" class="btn-primary">送出訊息</button>
      </form>
    </div>
  </main>
